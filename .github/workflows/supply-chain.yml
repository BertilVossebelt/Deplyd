name: Supply chain

# Weekly rather than on every push: an advisory appears because the world changed,
# not because this repository did, and cargo-deny takes a few minutes to install.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths:
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}

      - name: Install
        run: |
          test -x ~/.cargo/bin/cargo-deny || cargo install cargo-deny --locked

      - name: Check
        run: cargo deny check

  tree:
    name: dependency tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tree is small enough to read, which is the point. A jump in the count
      # means something new arrived, and that should be a decision rather than a
      # surprise noticed later.
      - name: Count
        run: |
          count=$(cargo tree -p deplyd --edges normal --prefix none \
            | awk '{print $1}' | sort -u | grep -v '^$' | wc -l)
          echo "$count crates in the shipped binary"
          if [ "$count" -gt 160 ]; then
            echo "::error::the dependency tree grew to $count crates (limit 160)"
            exit 1
          fi
