name: Deploy
on:
    push:
        branches: [main]
jobs:
    deploy-staging:
        runs-on: ubuntu-latest
        environment:
            name: staging
        steps:
            - uses: actions/checkout@v4
            - name: Build
              run: echo build
            - name: Ship
              run: echo ship
    deploy-production:
        runs-on: ubuntu-latest
        needs: deploy-staging
        environment:
            name: production
        steps:
            - uses: actions/checkout@v4
            - name: Build
              run: echo build
            - name: Ship
              run: echo ship
