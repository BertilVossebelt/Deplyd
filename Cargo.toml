[workspace]
members = ["crates/deplyd-gateway", "crates/deplyd-core", "crates/deplyd"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Bertil Vossebelt"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
anstream = "1.0.0"
anstyle = "1.0"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
insta = "1.48.0"

[profile.release]
strip = true
lto = true

[workspace.lints.rust]
unsafe_code = "forbid"
